---
name: release

# A version tag, v1.2.3 or v1.2.3-rc.1, builds the release as a draft for a
# maintainer to review and publish. See RELEASES.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # To create the draft release and upload to it.
      contents: write
      # To sign the checksums with cosign, keyless, as this workflow.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The Go cache is shared with every other run on the repository,
          # so a release does not restore what one of them could have planted.
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      # The RPMs are signed with the package repository's key, as dnf checks
      # each one's signature. Without it they are not, and the packages
      # workflow refuses them.
      - name: Write the package signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::warning::PACKAGES_GPG_PRIVATE_KEY is not set, so the RPMs are not signed"
            exit 0
          fi
          umask 077
          printf '%s\n' "$GPG_PRIVATE_KEY" > "$RUNNER_TEMP/package-signing.key"
          echo "GPG_KEY_FILE=$RUNNER_TEMP/package-signing.key" >> "$GITHUB_ENV"

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
