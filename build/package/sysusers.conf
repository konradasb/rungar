# The user rungar runs as. The configuration and the credentials it names are
# owned by root and readable by its group alone, and so are the daemon's
# socket and its events: adding a user to it lets them read the GitHub
# credential, and remove runners.
u rungar - "Rungar" / /usr/sbin/nologin
