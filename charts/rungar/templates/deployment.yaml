---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "rungar.fullname" . }}
  labels:
    {{- include "rungar.labels" . | nindent 4 }}
spec:
  # One daemon, always, and never two at once: the old pod stops before the
  # new one starts. The new one adopts every runner the old one left.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "rungar.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        # The daemon reads its configuration once, at start: a changed one
        # replaces the pod.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "rungar.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "rungar.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: rungar
          image: {{ include "rungar.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["serve", "--config", "/etc/rungar/config.yaml"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- with .Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- include "rungar.configMount" . | nindent 12 }}
            # The socket `kubectl exec ... rungar status` asks the daemon
            # through.
            - name: run
              mountPath: /run/rungar
            - name: events
              mountPath: /var/log/rungar
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        {{- include "rungar.configVolume" . | nindent 8 }}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: events
          {{- if .Values.events.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.events.persistence.existingClaim | default (printf "%s-events" (include "rungar.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
