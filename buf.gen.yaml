---
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: proto
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: proto
    opt:
      - paths=source_relative
      # The only implementation of each service lives in this repository, so
      # a new RPC should break the build until it is handled rather than
      # silently returning Unimplemented at runtime.
      - require_unimplemented_servers=false
