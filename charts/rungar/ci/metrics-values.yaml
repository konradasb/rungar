---
# The same, with the configuration as a file's text, with anchors, and
# metrics and persistent events enabled.
image:
  repository: rungar-chart-test
  tag: dev
  pullPolicy: Never
configFile: |
  github:
    url: https://github.com/my-org
    token_path: /etc/rungar/token
  providers:
    - &dicer
      name: compute1
      type: dicer
      address: dicer.invalid:7443
    - <<: *dicer
      name: compute2
      address: dicer2.invalid:7443
  log_level: debug
files:
  token: ghp_notarealtoken
metrics:
  enabled: true
events:
  persistence:
    enabled: true
