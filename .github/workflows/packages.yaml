---
name: packages

# A published release's deb and rpm packages go to the apt and dnf
# repository at pkg.rungar.sh, which build/repo builds, in a bucket. A
# pre-release's do not. Run by hand to publish a release's again, or one
# from before the repository. See RELEASES.md for the setup it needs.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release to publish, such as v0.2.0
        required: true

permissions:
  contents: read

# One at a time, and never cancelled halfway: each adds to what the last
# published.
concurrency:
  group: packages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      BUCKET: s3://${{ vars.PACKAGES_BUCKET }}
      AWS_ENDPOINT_URL: ${{ vars.PACKAGES_S3_ENDPOINT }}
      AWS_REGION: auto
      # Checksums only where the API requires them, which is all R2 takes.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the repository tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c rpm

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download the release's packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir incoming \
            --pattern '*.deb' --pattern '*.rpm' \
            --pattern checksums.txt --pattern checksums.txt.sigstore.json

      # Only what the release workflow built, for this tag, is published:
      # its signature on the checksums, and the checksums of every package.
      - name: Verify the packages
        working-directory: incoming
        run: |
          cosign verify-blob checksums.txt \
            --bundle checksums.txt.sigstore.json \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yaml@refs/tags/$TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          for f in *.deb *.rpm; do
            grep -q "  $f\$" checksums.txt || { echo "$f is not in checksums.txt"; exit 1; }
          done
          sha256sum --check --ignore-missing checksums.txt
          rm checksums.txt checksums.txt.sigstore.json

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PACKAGES_GPG_PRIVATE_KEY }}
        run: |
          test -n "$GPG_PRIVATE_KEY" || { echo "PACKAGES_GPG_PRIVATE_KEY is not set"; exit 1; }
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Download the repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
        run: aws s3 sync --only-show-errors "$BUCKET" repo

      - name: Add the packages
        run: build/repo/build.sh incoming repo

      - name: Upload the repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.PACKAGES_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PACKAGES_S3_SECRET_ACCESS_KEY }}
        run: build/repo/push.sh repo "$BUCKET"
