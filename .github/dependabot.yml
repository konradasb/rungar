---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually caught and pulled within days.
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually caught and pulled within days.
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"

  # The Dockerfile's base images, pinned by digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually caught and pulled within days.
    cooldown:
      default-days: 7
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
