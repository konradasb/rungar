{{- if not .Values.existingSecret }}
{{- if and (not .Values.config) (not .Values.configFile) }}
{{- fail "set config, the daemon's configuration, configFile, the same as a file, or existingSecret, a Secret holding config.yaml" }}
{{- end }}
{{- if and .Values.config .Values.configFile }}
{{- fail "set config or configFile, not both" }}
{{- end }}
{{- if hasKey .Values.files "config.yaml" }}
{{- fail "files cannot hold config.yaml: set config instead" }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rungar.fullname" . }}
  labels:
    {{- include "rungar.labels" . | nindent 4 }}
type: Opaque
data:
  config.yaml: {{ include "rungar.config" . | b64enc }}
  {{- range $name, $content := .Values.files }}
  {{ $name }}: {{ $content | b64enc }}
  {{- end }}
{{- end }}
